# Pull-request-only checks (docs/development/workflow.md §1–2). Required status checks besides `ci-ok`:
# `pr-title` and `branch-name`.
name: pr-checks

on:
  pull_request:
    # `edited`: re-check when the title changes.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: commitlint.config.mjs
          sparse-checkout-cone-mode: false
      - name: Read types and scopes from commitlint.config.mjs
        id: commitlint
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const { types, scopes } = await import(`${process.cwd()}/commitlint.config.mjs`)
          const out = process.env.GITHUB_OUTPUT
          appendFileSync(out, `types<<EOF\n${types.join('\n')}\nEOF\n`)
          appendFileSync(out, `scopes<<EOF\n${scopes.join('\n')}\nEOF\n`)
          JS
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ steps.commitlint.outputs.types }}
          scopes: ${{ steps.commitlint.outputs.scopes }}
          requireScope: false
          # Description starts lower case (imperative): "feat(perm): add event overrides".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description "{subject}" in the PR title "{title}" must start with a lower-case letter
            (imperative mood), e.g. "feat(perm): add event-level permission overrides".

  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            claude/*|release-please--*|dependabot/*|renovate/*|gh-readonly-queue/*)
              echo "Branch '$BRANCH' is created by automation: exempt."
              exit 0 ;;
          esac
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9._-]+$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch '$BRANCH' is valid."
          else
            echo "::error::Branch '$BRANCH' does not match $pattern (e.g. feat/event-overrides, fix/123-ical-dst). See docs/development/workflow.md §2."
            exit 1
          fi
