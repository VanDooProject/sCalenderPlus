# CI pipeline, see docs/development/workflow.md §5.
# Jobs are path-filtered; `ci-ok` always runs and is the single required status check.
name: ci

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NODE_VERSION: '22'

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Changing this workflow runs everything.
          filters: |
            backend:
              - 'backend/**'
              - 'global.json'
              - 'dotnet-tools.json'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/openapi/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      # CI=true (set by GitHub) turns on RestoreLockedMode in Directory.Build.props; --locked-mode makes it explicit.
      - name: Restore
        run: dotnet restore backend/SCalenderPlus.slnx --locked-mode
      - name: Build
        run: dotnet build backend/SCalenderPlus.slnx --no-restore --configuration Release
      - name: Verify formatting
        run: dotnet format backend/SCalenderPlus.slnx --verify-no-changes --no-restore
      # Includes the Docker (Testcontainers) tests: the ubuntu runner has a Docker daemon.
      - name: Test
        run: dotnet test --solution backend/SCalenderPlus.slnx --no-build --configuration Release

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped jobs (path filters) are fine; failed or cancelled ones are not.
      - name: Check needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job finished with '$result'"; exit 1 ;;
            esac
          done
