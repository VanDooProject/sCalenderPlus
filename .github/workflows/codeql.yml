# CodeQL security analysis (docs/development/workflow.md §5): C#, JavaScript/TypeScript and the
# workflows themselves. All languages use build-mode `none` (source extraction without compiling), which
# does not depend on the .NET SDK version, so .NET 10 needs no manual build here; `ci.yml` builds.
# Results: Security → Code scanning. Requires CodeQL "default setup" to be disabled (advanced setup).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/bin/**'
              - '**/obj/**'
              - 'frontend/packages/api-client/src/schema.d.ts'
              - 'backend/src/**/Persistence/Migrations/**'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
