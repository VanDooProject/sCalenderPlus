# Reusable workflow: build and push the multi-arch (linux/amd64 + linux/arm64) images api, worker and web
# to GHCR. Called by release-please.yml (release tags X.Y.Z, X.Y, latest) and images.yml (main, main-<sha>).
# See docs/development/workflow.md §4 and docs/deployment/coolify.md §2.
name: build-images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to build.
        type: string
        required: true
      version:
        description: Value of the VERSION build arg and the org.opencontainers.image.version label.
        type: string
        required: true
      tags:
        description: docker/metadata-action `tags` specification (one entry per line).
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR repository names must be lower case.
  IMAGE_PREFIX: ghcr.io/vandooproject/scalenderplus

jobs:
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            description: sCalenderPlus REST API, iCal feeds and the one-shot migrate command
          - image: worker
            description: sCalenderPlus background worker (jobs, emails, imports)
          - image: web
            description: sCalenderPlus web app (Caddy serving the SPA and proxying the api)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The build stages run on $BUILDPLATFORM (no emulation); QEMU is only needed for the few RUN
      # instructions of the arm64 runtime stage (web: setcap/adduser).
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags, OCI labels and annotations)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # `git` context: revision/created come from the checked-out ref, not the triggering event.
          context: git
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          flavor: latest=false
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=scalenderplus-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.vendor=VanDooProject
          annotations: |
            org.opencontainers.image.title=scalenderplus-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          provenance: mode=max
          sbom: true
          # Reuse the amd64 layers cached by ci.yml (scope <image>) and keep a multi-arch cache of our own.
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=${{ matrix.image }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-multiarch
      - name: Job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### scalenderplus-$IMAGE"
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
