# Local development dependencies: PostgreSQL + Mailpit.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Matches backend/src/*/appsettings.Development.json (database scal, user scal, password scal).
name: scalenderplus-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scal
      POSTGRES_USER: scal
      POSTGRES_PASSWORD: scal
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scal -d scal']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI + API (http://localhost:8025)

volumes:
  postgres-data:
